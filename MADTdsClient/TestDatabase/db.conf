#  db.conf -- the pinned test server and dataset for MADTdsClient.
#
#  Read by sqlserver-test-db.sh.  Both halves are pinned: the server image by
#  tag *and* digest, the data by URL and archive checksum.  The container
#  records nothing itself; `up` checks for the database and restores the backup
#  only when it is missing, so a live volume is left alone.
#
#  Server: SQL Server 2022 Developer, the image the live tests in
#  MADTdsClientTests/MADTdsClientLiveTests.m were written against.  Using it
#  means accepting Microsoft's EULA (the script passes ACCEPT_EULA=Y).
MSSQL_IMAGE_TAG="mcr.microsoft.com/mssql/server:2022-latest"

# The digest is the multi-arch image index, so the pin holds on arm64 and
# x86_64 alike.  Refresh it with:
#     docker buildx imagetools inspect <tag>   # "Digest:" line
MSSQL_IMAGE_DIGEST="sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090"

# The one login the live tests use.  It must satisfy SQL Server's password
# policy; changing it means changing the tests' default too (or overriding
# MAD_TDS_TEST_PASSWORD).
SA_PASSWORD="Root1@Root2"

#  Data: AdventureWorksLT2022, the small ("LT") AdventureWorks sample the live
#  tests and the CLI fixture were built against.  Microsoft publishes the
#  backup on the sql-server-samples releases page.
DATABASE_NAME="AdventureWorksLT2022"
DATASET_URL="https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorksLT2022.bak"
DATASET_SHA256="7e1ae09a08ee0342781bacfba9da79e91b67991aabcd1a42454a3b64eb60d626"
DATASET_FILENAME="AdventureWorksLT2022.bak"

# The backup's logical file names, from RESTORE FILELISTONLY; the restore has
# to MOVE them onto the container's own data directory.
DATASET_LOGICAL_DATA="AdventureWorksLT2022_Data"
DATASET_LOGICAL_LOG="AdventureWorksLT2022_Log"

# The one number `verify` pins: SalesLT.Product rows in this backup.
DATASET_PRODUCT_COUNT="295"
