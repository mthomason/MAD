#  db.conf -- the pinned test server and dataset for MADMySQL.
#
#  Read by mysql-test-db.sh.  Both halves are pinned: the server image by tag
#  *and* digest, the data by repository commit *and* archive checksum.  The
#  loader records what it loaded, so bumping either pin makes the next `up`
#  re-import rather than quietly reuse a stale volume.
#
#  Server: MySQL 8.4 LTS -- the same major line as the mysqlclient the app
#  links (Compressor/matrix.conf -> mysqlclient 8.4.10), so the client and the
#  server the tests talk to stay on one auth/type surface.
MYSQL_IMAGE_TAG="mysql:8.4"

# The digest is the multi-arch image index, so the pin holds on arm64 and
# x86_64 alike.  Refresh it with:
#     docker buildx imagetools inspect <tag>   # "Digest:" line
MYSQL_IMAGE_DIGEST="sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242"

#  Data: the standard `employees` sample database -- the dataset the live
#  tests in MADMySQLTests/MADMySQLLiveTests.m already assume (300024 employees,
#  2844047 salaries).  Upstream: https://github.com/datacharmer/test_db
DATASET_COMMIT="e324b56193ca506ab7cc1ab143a9153d8c4535d7"
DATASET_URL="https://github.com/datacharmer/test_db/archive/${DATASET_COMMIT}.tar.gz"
DATASET_SHA256="44a63c000011eca73770f8ee45713c71d9ce05c360393cd0c9fb2f33c744cd8e"

# The directory the archive extracts to, and the upstream script that verifies
# every table against its own expected row count and SHA-1 checksum.
DATASET_DIRNAME="test_db-${DATASET_COMMIT}"
DATASET_CHECKSUM_SQL="test_employees_sha.sql"

# The one number the live test suite pins directly.
DATASET_EMPLOYEE_COUNT="300024"
