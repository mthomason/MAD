#  db.conf -- the pinned test server and dataset for MADPostgres.
#
#  Read by postgres-test-db.sh.  Both halves are pinned: the server image by
#  tag *and* digest, the data by release URL and file checksum.  The loader
#  records what it loaded, so bumping either pin makes the next `up` re-import
#  rather than quietly reuse a stale volume.
#
#  Server: PostgreSQL 17 -- the same major line as the libpq the app and Linux
#  image link (Compressor/matrix.conf and Linux/libraries.conf -> 17.11).
POSTGRES_IMAGE_TAG="postgres:17-bookworm"

# The digest is the multi-arch image index, so the pin holds on arm64 and
# x86_64 alike.  Refresh it with:
#     docker buildx imagetools inspect <tag>   # "Digest:" line
POSTGRES_IMAGE_DIGEST="sha256:d2b1a0795f5ecbe49dc07be0b35b62977aff9152870ea332375021c79ea4905b"

# The login and database the live tests use (overridable via MAD_PG_TEST_*).
POSTGRES_USER="mad"
POSTGRES_PASSWORD="mad_test_pw"
DATABASE_NAME="chinook"

#  Data: the standard Chinook PostgreSQL sample database (v1.4.5), upstream:
#  https://github.com/lerocha/chinook-database
DATASET_VERSION="v1.4.5"
DATASET_FILENAME="Chinook_PostgreSql.sql"
DATASET_URL="https://github.com/lerocha/chinook-database/releases/download/${DATASET_VERSION}/${DATASET_FILENAME}"
DATASET_SHA256="e3fde5c1a5b51a2a91429a702c9ca6e69ba56e6c7f5e112724d70c3d03db695e"

# Row counts pinned by `verify` and by MADPostgresLiveTests.
DATASET_ARTIST_COUNT="275"
DATASET_ALBUM_COUNT="347"
DATASET_TRACK_COUNT="3503"
