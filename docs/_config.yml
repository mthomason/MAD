# The documentation site's Jekyll configuration (GitHub Pages, source: /docs).
# English pages live at the site root; the Simplified Chinese, Japanese,
# Brazilian Portuguese, German, and Latin American Spanish translations mirror
# them under zh/, ja/, pt-br/, de/, and es/.
# All trees share the theme, the layouts, and the language switcher in
# _layouts/default.html.

title: MAD
tagline: Mobile Analytics Document — Open Relational Reporting Format, Engine, and Native macOS & iOS Designer
description: >-
  An open format and embeddable engine for relational reporting — where every
  report is a portable query graph, a materialized SQLite table, and a
  parametric layout.
url: https://docs.everydayapps.com
# Google Analytics 4 measurement ID. The tag is emitted by
# _includes/head-custom.html with Consent Mode v2 defaults; the banner it
# allows is shown only to EEA/UK/CH timezones (see that file).
google_analytics_ga4: G-AD8V5X9SLR
logo: /assets/mad-designer-icon-512.png
author:
  name: Michael Thomason
  url: https://github.com/mthomason
social:
  name: MAD — Mobile Analytics Document
  links:
    - https://github.com/mthomason/MAD
    - https://mad.everydayapps.com
theme: jekyll-theme-primer
lang: en-US

# Internal records are excluded for every language tree. The bare entries cover
# the English root; the globs cover the per-language mirrors (zh/, ja/, pt-br/,
# de/, es/, and any language added later). Jekyll matches exclude entries with
# File.fnmatch?, where "*/project" matches any path that ends in /project (and
# does not match the bare root name, which the entry above it covers).
exclude:
  - project
  - archive
  - "*/project"
  - "*/archive"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/macos-native-mad-designer.png
  - scope:
      path: "zh"
    values:
      lang: zh-CN
      locale: zh_CN
  - scope:
      path: "ja"
    values:
      lang: ja-JP
      locale: ja_JP
  - scope:
      path: "pt-br"
    values:
      lang: pt-BR
      locale: pt_BR
  - scope:
      path: "de"
    values:
      lang: de-DE
      locale: de_DE
  - scope:
      path: "es"
    values:
      lang: es-419
      locale: es_419
