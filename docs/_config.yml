# The documentation site's Jekyll configuration (GitHub Pages, source: /docs).
# English pages live at the site root; the Simplified Chinese, Japanese, and
# Brazilian Portuguese translations mirror them under zh/, ja/, and pt-br/.
# All trees share the theme, the layouts, and the language switcher in
# _layouts/default.html.

title: MAD
tagline: Mobile Analytics Document — Open Relational Reporting Format, Engine, and Native macOS & iOS Designer
description: >-
  An open format and embeddable engine for relational reporting — where every
  report is a portable query graph, a materialized SQLite table, and a
  parametric layout.
url: https://docs.everydayapps.com
logo: /assets/mad-designer-icon-512.png
author:
  name: Michael Thomason
  url: https://github.com/mthomason
social:
  name: MAD — Mobile Analytics Document
  links:
    - https://github.com/mthomason/MAD
    - https://mad.everydayapps.com
theme: jekyll-theme-primer
lang: en-US

exclude:
  - project
  - archive
  - zh/project
  - zh/archive

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/macos-native-mad-designer.png
  - scope:
      path: "zh"
    values:
      lang: zh-CN
      locale: zh_CN
  - scope:
      path: "ja"
    values:
      lang: ja-JP
      locale: ja_JP
  - scope:
      path: "pt-br"
    values:
      lang: pt-BR
      locale: pt_BR
