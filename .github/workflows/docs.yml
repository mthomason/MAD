name: Documentation checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  docs:
    name: docs checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run the checker unit tests
        run: |
          python3 -I scripts/docs/check_links_test.py
          python3 -I scripts/docs/check_translations_test.py
          python3 -I scripts/docs/check_site_facts_test.py

      - name: Check links
        run: python3 -I scripts/docs/check_links.py

      - name: Check translation parity
        run: python3 -I scripts/docs/check_translations.py --require-complete

      - name: Check facts and leaks
        run: python3 -I scripts/docs/check_site_facts.py --docs docs --repo .
