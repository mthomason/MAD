# macOS verification — the Apple suites' gate.
#
# The barcode, image and PDF closures all touched source that compiles on
# Apple, but only the Linux gate ran while they landed.  This workflow runs
# the same four checks as docs/archive/MAD_BARCODES.md section 3 on every PR:
# the MADBarcodes suite, the MAD suite, the iOS app build, and the macOS app's
# end-to-end smoke suite.
#
# The frameworks link Compressor's xcframeworks, which are never committed, so
# the first run downloads and builds the pinned third-party sources for all
# three platforms (~15-40 minutes).  The artifacts are cached before the suites
# run, so a failing test run still leaves them for the next attempt; later runs
# restore them and the ensure step is a no-op.  The recipe scratch trees and
# downloaded sources are deleted after the build because the runner's disk is
# the constraint, not the source download.  The disk line and the test-result
# artifact exist because a purge of the simulator's tmp directory is one way a
# test can fail without failing cleanly.
#
# The simulator is chosen from the devices actually installed on the runner:
# the checked-out CLAUDE.md pins a device id locally, and a name/OS pair is not
# stable across Xcode images (`OS:latest` can resolve to a runtime that lacks
# the named device).  Any available iPhone runs these suites.
#
# This check is not yet in the "Protect master" ruleset; the required checks
# remain "Linux verification" and "DCO".

name: macOS verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS verification
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          df -h /

      - name: Restore the third-party static libraries
        id: libs-cache
        uses: actions/cache/restore@v4
        with:
          path: Compressor/library
          key: compressor-${{ runner.os }}-${{ hashFiles('Compressor/matrix.conf', 'Compressor/lib/**') }}
          restore-keys: |
            compressor-${{ runner.os }}-

      - name: Build the third-party static libraries
        run: ./Compressor/build.sh --all --platforms ios,simulator,macosx

      # Save before the suites, so a failing run still leaves the expensive
      # artifacts for the next attempt.  A hit needs no second upload.
      - name: Save the third-party static libraries
        if: steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Compressor/library
          key: compressor-${{ runner.os }}-${{ hashFiles('Compressor/matrix.conf', 'Compressor/lib/**') }}

      - name: Drop the recipe scratch trees and sources
        run: rm -rf Compressor/build Compressor/media

      - name: Choose an available iPhone simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "${udid}"
          echo "Using simulator ${udid}"
          echo "MAD_SIMULATOR_UDID=${udid}" >> "${GITHUB_ENV}"
          # Shared DerivedData is required: the frameworks reference each other
          # through BUILT_PRODUCTS_DIR.  Set here, not in a job-level env, where
          # the runner context is not available to GitHub's workflow parser.
          echo "MAD_DERIVED_DATA=${RUNNER_TEMP}/DerivedData" >> "${GITHUB_ENV}"

      - name: Run the MADBarcodes suite
        run: |
          set -euo pipefail
          xcodebuild test -workspace Reports.xcworkspace -scheme MADBarcodes \
            -destination "platform=iOS Simulator,id=${MAD_SIMULATOR_UDID}" \
            -derivedDataPath "${MAD_DERIVED_DATA}"

      - name: Run the MAD suite
        run: |
          set -euo pipefail
          xcodebuild test -workspace Reports.xcworkspace -scheme MAD \
            -destination "platform=iOS Simulator,id=${MAD_SIMULATOR_UDID}" \
            -derivedDataPath "${MAD_DERIVED_DATA}"

      - name: Build the iOS app
        run: |
          set -euo pipefail
          xcodebuild build -workspace Reports.xcworkspace -scheme 'MAD Designer' \
            -destination "platform=iOS Simulator,id=${MAD_SIMULATOR_UDID}" \
            -derivedDataPath "${MAD_DERIVED_DATA}"

      - name: Build and smoke-test the macOS app
        run: ./Mac/build.sh --smoke-test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ${{ env.MAD_DERIVED_DATA }}/Logs/Test
          if-no-files-found: ignore
