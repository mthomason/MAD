# Publish the `mad` runtime image to GHCR -- the distribution vehicle.
#
# Builds the runtime stage of Linux/Dockerfile (the CLI deliverable,
# docs/developers/cli.md §5.5) and pushes it to ghcr.io/mthomason/mad as
# :latest and :<short-sha>.  Runs on pushes to master and by hand from the
# Actions tab; deliberately not on pull requests -- a PR must not publish.
# ubuntu-latest is native amd64, the platform the published tag targets (the
# Mac's local build of mad-cli:latest is arm64).
#
# The toolchain layers are shared with the linux.yml verification job through
# the one gha cache scope, so a publish after a verification run only rebuilds
# the runtime layer.
#
# The file activates the moment the repository is published on GitHub; it is
# inert until then.  If the default branch is renamed at publication, update
# the `master` trigger below.

name: Publish image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The image reports the commit count as its revision.  A shallow
          # checkout counts 1, so fetch the history.
          fetch-depth: 0

      # The Docker context excludes .git, so the image cannot derive its own
      # identity.  Pass the commit and count in; BuildInfo writes them beside
      # mad and the Linux verification asserts the result.
      - name: Compute the build identity
        id: build_identity
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build the runtime stage and push it to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Linux/Dockerfile
          target: runtime
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/mthomason/mad:latest
            ghcr.io/mthomason/mad:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=mad-linux
          cache-to: type=gha,mode=max,scope=mad-linux
          build-args: |
            MAD_SOURCE_COMMIT=${{ steps.build_identity.outputs.commit }}
            MAD_BUILD_NUMBER=${{ steps.build_identity.outputs.count }}
            MAD_SOURCE_DIRTY=false
          push: true
