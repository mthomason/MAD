# Developer Certificate of Origin -- the DCO check promised in
# CONTRIBUTING.md. Every commit in a pull request must carry a
# Signed-off-by line (git commit -s). Runs on pull requests only;
# required by the "Protect master" ruleset.

name: DCO

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dco:
    # The check name is the job name, and the "Protect master" ruleset
    # requires the context "DCO" -- keep the two in step.
    name: DCO
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head, not the merge ref: checkout's default for
      # pull_request events is refs/pull/N/merge, GitHub's synthetic merge
      # commit, which carries no Signed-off-by and fails the loop below on
      # every PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check every commit is signed off
        run: |
          set -euo pipefail
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}:refs/remotes/$base" --quiet
          for commit in $(git rev-list "$base..HEAD"); do
            if ! git log -1 --format='%B' "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by line (use git commit -s)"
              exit 1
            fi
          done
          echo "All commits are signed off."
