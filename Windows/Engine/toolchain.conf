# Windows engine toolchain pins — the single place the toolchain recipe is
# written down.  This is the Windows counterpart to Linux/toolchain.conf, and
# it records the exact, proven recipe from docs/project/MAD_WINDOWS.md and
# C:\dev\mad-win-reports\viability-final.md.
#
# The Windows toolchain is built by gnustep/tools-windows-msvc (a build
# *driver*, not a library), so unlike Linux there is no per-component build
# function of our own to feed.  The seven component revisions are applied as a
# patch (toolchain/revision-pins.patch) that sets TAG= in the driver's phase
# scripts, and the driver itself is pinned to a commit because its master
# floats.  Nothing here ships in the app.
#
# Do not change the compiler, STL, or Visual Studio/SDK without a new
# viability test (docs/project/MAD_WINDOWS.md §2).

# The build driver.  Upstream master floats and must not be tracked.
tools-windows-msvc = 54d08e57414781f3ff41caa6eff265ca15e29724
tools-windows-msvc-url = https://github.com/gnustep/tools-windows-msvc.git

# Compiler and platform.  Clang 23.x's Objective-C codegen crashes every
# Foundation binary at startup; Clang 20.1.8 is the known-good compiler.
clang = 20.1.8
lld = 20.1.8
visual-studio = 2026 18.12.0
windows-sdk = 10.0.26100

# The STL gate override.  VS 2026's MSVC STL hard-requires "Clang 22 or newer"
# (_MSVC_STL_UPDATE 202609L, yvals_core.h).  The override is the STL's own
# escape hatch and is proven benign for the code involved (viability-final.md
# §4).  It is applied in toolchain/stl-gate-override.patch and to every
# Objective-C++ translation unit in the framework build.
stl-gate-override = -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

# The seven pinned GNUstep component revisions.  tools-windows-msvc master
# carried a runtime regression (its CI builds but never runs a binary), so the
# known-good 2026-11-14 revisions are pinned.  These exact values are what
# toolchain/revision-pins.patch writes into the driver's phase scripts.
libobjc2        = a21ae931e4c186312701d7a4a8e85204955965a6
libffi          = v3.8.0
libiconv        = a536e24a6793debf84779e0dbc8081a8af83bc1a
libdispatch     = 22798930c98f60dcdbd8ede3edb560be6abf4a81
gnustep-make    = e7c0730d54e272b2ff56d508fcb0bcfd9a890985
gnustep-base    = 24654296b7d3ae10495e31eca835b6d32c781bcf
gnustep-corebase = 67a6f90601e7b143f173d1403f9a381a6d968fc2

# Install prefix.  The driver installs into %PREFIX%\x64\Release.
prefix = C:\GNUstep
