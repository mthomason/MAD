# Windows library pins -- the C libraries the frameworks link, with the same
# shape and intent as Linux/libraries.conf and ../Compressor/matrix.conf
# (docs/project/MAD_LINUX.md §7).  Read only by Windows/Engine/build.ps1; nothing
# here ships in the app, and nothing is in git.
#
# Columns: name  version  ref  commit  sha256  url
#   name    identifier used to form shell variables and build function names,
#           so it must be a valid identifier (underscores, not dashes)
#   ref     git tag cloned with --recurse-submodules, "-" for archives
#   commit  full commit SHA checked out (and verified) after the clone,
#           "-" for archives
#   sha256  archive hash, "-" for git sources (the commit is the pin)
#   url     download URL, or a comma-separated list of mirror URLs
#           (primary,fallback) tried in order
#
# Only sqlite3 is needed today (MADSqlite3, Phase 2b).  The other C libraries
# the Linux build carries (openssl, freetds, zlib, bzip2, libarchive, mariadb,
# postgres) arrive with the driver frameworks in a later phase.
#
# sqlite3 is the same 3.53.3 the Compressor matrix pins.  Compressor builds it
# from sqlite-src (generating the amalgamation); this build takes the released
# amalgamation tarball instead, and compiles it with the same option list --
# Compressor/sqlite3.xcconfig, read by build.ps1, is still the one place those
# format-deciding flags are written down.  The hash below was computed from
# sqlite.org on 2026-10-06 (the Linux pin).
name      version  ref  commit  sha256                                                            url
sqlite3   3.53.3   -    -       c917d7db16648ec95f714974ace5e5dcf46b7dc70e26600a0a102a3141125db0  https://www.sqlite.org/2026/sqlite-autoconf-3530300.tar.gz,https://sqlite.org/2026/sqlite-autoconf-3530300.tar.gz
