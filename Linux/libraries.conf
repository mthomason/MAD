# Linux library pins -- the C libraries the frameworks link, with the same
# shape and intent as ../Compressor/matrix.conf (MAD_LINUX.md §7).  Read only
# by Linux/lib/libraries.sh inside the build image; nothing here ships in the
# app, and nothing is in git.
#
# Columns: name  version  ref  commit  sha256  url
#   name    identifier used to form shell variables and build function names,
#           so it must be a valid identifier (underscores, not dashes)
#   ref     git tag cloned with --recurse-submodules, "-" for archives
#   commit  full commit SHA checked out (and verified) after the clone,
#           "-" for archives
#   sha256  archive hash, "-" for git sources (the commit is the pin)
#
# sqlite3 is the same 3.53.3 the Compressor matrix pins.  Compressor builds it
# from sqlite-src (generating the amalgamation); the Linux build takes the
# released amalgamation tarball instead, and compiles it with the same option
# list -- Compressor/sqlite3.xcconfig, copied into the image, is still the one
# place those format-deciding flags are written down.  The hash below was
# computed from sqlite.org on 2026-10-06.
name      version  ref  commit  sha256                                                            url
sqlite3   3.53.3   -    -       c917d7db16648ec95f714974ace5e5dcf46b7dc70e26600a0a102a3141125db0  https://www.sqlite.org/2026/sqlite-autoconf-3530300.tar.gz
openssl   3.5.9    -    -       603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  https://www.openssl.org/source/openssl-3.5.9.tar.gz
freetds   1.4.27   -    -       671a861b1ffd44b8a322aea395b63f2c10a6b9e9740468b1e1abeed68386c78f  https://www.freetds.org/files/stable/freetds-1.4.27.tar.gz
