# Linux toolchain pins -- the single place every component's version, source
# and hash is written down (docs/project/MAD_LINUX.md Phase B).  The Compressor matrix is
# the model; this file is read only by Linux/lib/toolchain.sh inside the build
# image, and nothing here is shipped in the app.
#
# Columns: name  version  ref  commit  sha256  url
#   name    identifier used to form shell variables and build function names,
#           so it must be a valid identifier (underscores, not dashes)
#   ref     git tag cloned with --recurse-submodules, "-" for archives
#   commit  full commit SHA checked out (and verified) after the clone,
#           "-" for archives
#   sha256  archive hash, "-" for git sources (the commit is the pin)
#   url     download URL, or a comma-separated list of mirror URLs
#           (primary,fallback) tried in order
#
# gnustep_make and gnustep_base publish PGP signatures, not checksums; the
# sha256 values below were computed from ftp.gnustep.org on 2026-10-06 (and
# match the official GNUstep GitHub release tarballs byte-for-byte).
#
# Build order is the one GNUstep's Linux guide prescribes -- libobjc2 ->
# libdispatch -> gnustep_make -> gnustep_base -- and is encoded in
# Linux/lib/toolchain.sh, together with the per-component build knowledge the
# same way Compressor recipes carry it.
name          version  ref                  commit                                    sha256                                                            url
libobjc2      2.3      v2.3                 e877e782fb965c4e870d2ecf6aff58dddc6290ae  -                                                                 https://github.com/gnustep/libobjc2.git
libdispatch   6.1.3    swift-6.1.3-RELEASE  886ca22f659c53dae66a40ee8266c7aae9bb97cd  -                                                                 https://github.com/apple/swift-corelibs-libdispatch.git
gnustep_make  2.9.3    -                    -                                         93ca320b706279ebca53760da89d4c3f2bbc547f4723967140a34346d9f04c24  https://github.com/gnustep/tools-make/releases/download/make-2_9_3/gnustep-make-2.9.3.tar.gz,https://ftp.gnustep.org/pub/gnustep/core/gnustep-make-2.9.3.tar.gz
gnustep_base  1.31.1   -                    -                                         e7546f1c978a7c75b676953a360194a61e921cb45a4804497b4f346a460545cd  https://github.com/gnustep/libs-base/releases/download/base-1_31_1/gnustep-base-1.31.1.tar.gz,https://ftp.gnustep.org/pub/gnustep/core/gnustep-base-1.31.1.tar.gz
